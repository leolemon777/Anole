name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 11.16.0
  NODE_VERSION: 24

jobs:
  windows-alpha:
    name: Windows Alpha (signed when the code-signing secret exists)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare pinned Windows Starter packs
        shell: pwsh
        run: scripts/prepare_windows_starter_pack.ps1
      - name: Assert the starter pack is populated
        shell: pwsh
        run: |
          $root = 'dist/engine-packs/windows-x86_64/starter'
          $bundle = Join-Path $root 'bundle.json'
          if (-not (Test-Path -LiteralPath $bundle)) {
            throw "starter pack is empty or missing $bundle - an empty-directory workaround must never ship"
          }
          $entries = @(Get-ChildItem -LiteralPath $root -Recurse -File)
          if ($entries.Count -lt 400) {
            throw "starter pack looks incomplete: only $($entries.Count) files under $root (pdf+media+ocr expected)"
          }
          $manifests = @(Get-ChildItem -LiteralPath $root -Filter manifest.json -Recurse)
          if ($manifests.Count -ne 3) {
            throw "starter pack must contain exactly three engine manifests (pdf/media/ocr), found $($manifests.Count)"
          }
          Write-Output "starter pack verified: $($entries.Count) files, 3 manifests, bundle.json present"
      - name: Stage dev updater key for the unsigned rehearsal
        env:
          DEV_KEY: ${{ secrets.TAURI_DEV_UPDATER_KEY }}
          DEV_KEY_PASSWORD: ${{ secrets.TAURI_DEV_UPDATER_PASSWORD }}
        shell: pwsh
        run: |
          # Unsigned Alpha rehearsals have no release key; the dev keypair
          # (test-only, never for a published channel) lives in the
          # TAURI_DEV_UPDATER_KEY repo variable so the private half never
          # enters the repository.
          $key = $env:DEV_KEY
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Output 'No dev key variable set; skipping updater artifact signing setup.'
            exit 0
          }
          # Tauri's minisign loader is picky about file encoding; passing the
          # key content directly as the env var value avoids the file layer.
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:DEV_KEY_PASSWORD" >> $env:GITHUB_ENV
      - name: Build offline NSIS candidate
        run: pnpm --filter @anole/desktop tauri build --bundles nsis
      - name: Authenticode-sign release artifacts (spec E-01)
        # Activates itself once DECISION-1 lands and the signing secret exists;
        # until then the rehearsal stays an explicit unsigned Alpha.
        env:
          CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          # Timestamp authority must be reached over the network; DigiCert's
          # public TSA works with any issuer's certificate.
          CODESIGN_TSA_URL: ${{ vars.WINDOWS_CODESIGN_TSA_URL || 'http://timestamp.digicert.com' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX)) {
            Write-Output 'No WINDOWS_CODESIGN_PFX secret configured; skipping Authenticode signing (DECISION-1 pending).'
            exit 0
          }
          # DECISION-1 (cloud-signing KSP route, see
          # docs/release/CODE_SIGNING_DECISION_BRIEF.md): install the CA's
          # KSP middleware here, then signtool addresses the certificate by
          # subject/thumbprint instead of the PFX below.
          $pfx = New-TemporaryFile
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
            $files = @(
              'target/release/anole-desktop.exe',
              'target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe'
            )
            $signtool = Join-Path `
              'C:\Program Files (x86)\Windows Kits\10\bin' `
              ((Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' |
                Sort-Object Name -Descending | Select-Object -First 1).Name) `
              'x64\signtool.exe'
            foreach ($file in $files) {
              & $signtool sign /fd SHA256 /tr $env:CODESIGN_TSA_URL /td SHA256 `
                /f $pfx /p $env:CODESIGN_PASSWORD $file
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
              & $signtool verify /pa /all $file
              if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $file" }
              Write-Output "signed and verified: $file"
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Generate checksums
        # Runs after signing so SHA256SUMS covers the signed bytes.
        run: python scripts/generate_checksums.py target/release/anole-desktop.exe target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe
      - name: Assert signature state matches the signing decision
        shell: pwsh
        env:
          CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        run: |
          $files = @(
            'target/release/anole-desktop.exe',
            'target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe'
          )
          $expectSigned = -not [string]::IsNullOrWhiteSpace($env:CODESIGN_PFX)
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file).Status.ToString()
            if ($expectSigned -and $status -ne 'Valid') {
              throw "signing secret is configured but $file reports signature state $status"
            }
            if (-not $expectSigned -and $status -ne 'NotSigned') {
              throw "Unsigned Alpha workflow received unexpected signature state $status for $file"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: anole-windows-unsigned-alpha
          if-no-files-found: error
          path: |
            target/release/anole-desktop.exe
            target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe
            dist/SHA256SUMS
          retention-days: 14
